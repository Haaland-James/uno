name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx next lint
      - run: npx tsc --noEmit
      - run: npx vitest run

  docker-smoke:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: checks
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: uno
          POSTGRES_PASSWORD: uno
          POSTGRES_DB: uno
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://uno:uno@127.0.0.1:5432/uno?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: uno:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_ENV=CI

      - name: Apply migrations from a clean database
        run: |
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" -e DIRECT_URL="$DATABASE_URL" \
            uno:ci prisma migrate deploy

      - name: Boot app and hit /api/health
        run: |
          docker run -d --name uno --network host \
            -e DATABASE_URL="$DATABASE_URL" -e DIRECT_URL="$DATABASE_URL" \
            -e NEXTAUTH_SECRET=ci-only-secret -e NEXTAUTH_URL=http://localhost:3000 \
            uno:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          echo "App never became healthy"; docker logs uno; exit 1
