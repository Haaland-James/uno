name: Deploy

# dev  → staging    (https://staging-uno.srv602517.hstgr.cloud)
# main → production (https://uno.srv602517.hstgr.cloud)
#
# Both branches only change via reviewed PRs where CI must pass, so this workflow
# doesn't re-run lint/type-check. The "production" GitHub Environment should have
# a required reviewer, so a merge to main waits for a click before it ships.

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/haaland-james/uno

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: target
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "app_env=PROD"           >> "$GITHUB_OUTPUT"
            echo "tag=prod-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
            echo "app_env=STAGING"     >> "$GITHUB_OUTPUT"
            echo "tag=staging-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.target.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* are public by definition (shipped in the JS bundle),
          # so they live in repo Variables, not Secrets.
          build-args: |
            NEXT_PUBLIC_APP_ENV=${{ steps.target.outputs.app_env }}
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}

  deploy:
    name: Deploy to ${{ needs.build.outputs.environment }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ needs.build.outputs.environment }}
      url: ${{ needs.build.outputs.environment == 'production' && 'https://uno.srv602517.hstgr.cloud' || 'https://staging-uno.srv602517.hstgr.cloud' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pinned host key — no ssh-keyscan, so a spoofed server can't intercept the deploy.
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Sync deploy files
        # Compose file and scripts ship from git on every deploy, so server
        # config changes are reviewed like code. Secret env files are untouched.
        run: tar -C deploy -cf - . | ssh vps 'tar -C /opt/uno -xf - && chmod +x /opt/uno/*.sh /opt/uno/initdb/*.sh'

      - name: Pull, migrate, restart
        # GITHUB_TOKEN is short-lived (expires when this job ends), so the server
        # never holds a long-lived registry credential.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh vps "
            docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null &&
            /opt/uno/deploy.sh '${{ needs.build.outputs.environment }}' '${{ needs.build.outputs.tag }}';
            status=\$?; docker logout ghcr.io >/dev/null; exit \$status
          "
